<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Incident Register — TSI Compass</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .filter-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
    .filter-bar select,.filter-bar input{padding:.45rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--card);color:var(--text)}
    .filter-bar input{flex:1;min-width:180px}
    .badge{display:inline-block;padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .badge-open{background:#fee2e2;color:#991b1b}
    .badge-investigating{background:#fef3c7;color:#92400e}
    .badge-contained{background:#dbeafe;color:#1e40af}
    .badge-resolved{background:#d1fae5;color:#065f46}
    .badge-closed{background:#f3f4f6;color:#6b7280}
    .badge-low{background:#f0fdf4;color:#166534}
    .badge-medium{background:#fef9c3;color:#854d0e}
    .badge-high{background:#fee2e2;color:#991b1b}
    .badge-critical{background:#fce7f3;color:#9d174d}
    .badge-yes{background:#fef3c7;color:#92400e}
    .badge-no{background:#f3f4f6;color:#6b7280}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th{background:var(--sidebar-bg);padding:.65rem 1rem;text-align:left;font-weight:600;color:var(--text-muted);white-space:nowrap}
    td{padding:.7rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:hover td{background:var(--hover)}
    .btn{padding:.45rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--border);color:var(--text)}
    .btn-sm{padding:.3rem .65rem;font-size:.78rem}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border-radius:10px;padding:2rem;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
    .modal h3{margin:0 0 1.25rem;font-size:1.05rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--text-muted)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.875rem;background:var(--bg);color:var(--text);box-sizing:border-box}
    .form-group textarea{resize:vertical;min-height:80px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .section-divider{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:1.25rem 0 .75rem;padding-bottom:.35rem;border-bottom:1px solid var(--border)}
    .modal-actions{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-size:.85rem;z-index:999;display:none}
    .toast.show{display:block}
    .empty-state{text-align:center;padding:3rem;color:var(--text-muted)}
  </style>
</head>
<body>
<div id="app-shell"></div>
<script>
var token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
</script>
<script src="js/shell.js"></script>

<div class="main-content" style="padding:1.5rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.25rem">
        <a href="incidents.html" style="color:var(--accent);text-decoration:none">Incidents &amp; Awareness</a> › Incident Register
      </div>
      <h2 style="margin:0;font-size:1.3rem">Incident Register</h2>
    </div>
    <button class="btn btn-primary" onclick="openAdd()">+ Report Incident</button>
  </div>

  <div class="filter-bar">
    <select id="f-status" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="OPEN">Open</option>
      <option value="INVESTIGATING">Investigating</option>
      <option value="CONTAINED">Contained</option>
      <option value="RESOLVED">Resolved</option>
      <option value="CLOSED">Closed</option>
    </select>
    <select id="f-severity" onchange="applyFilters()">
      <option value="">All Severities</option>
      <option value="LOW">Low</option>
      <option value="MEDIUM">Medium</option>
      <option value="HIGH">High</option>
      <option value="CRITICAL">Critical</option>
    </select>
    <select id="f-type" onchange="applyFilters()">
      <option value="">All Types</option>
      <option value="DATA_BREACH">Data Breach</option>
      <option value="MALWARE">Malware</option>
      <option value="PHISHING">Phishing</option>
      <option value="UNAUTHORIZED_ACCESS">Unauthorized Access</option>
      <option value="AVAILABILITY">Availability</option>
      <option value="OTHER">Other</option>
    </select>
    <input id="f-search" type="text" placeholder="Search incidents…" oninput="applyFilters()"/>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Incident #</th>
          <th>Title</th>
          <th>Type</th>
          <th>Severity</th>
          <th>Status</th>
          <th>RCA Done</th>
          <th>Reported By</th>
          <th>Detected</th>
          <th>Resolved</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="inc-tbody">
        <tr><td colspan="10" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>Report Incident</h3>
    <div class="form-group">
      <label>Title *</label>
      <input id="a-title" type="text" placeholder="Brief incident description"/>
    </div>
    <div class="form-group">
      <label>Description *</label>
      <textarea id="a-desc" placeholder="What happened? Scope, initial impact…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Type *</label>
        <select id="a-type">
          <option value="">Select…</option>
          <option value="DATA_BREACH">Data Breach</option>
          <option value="MALWARE">Malware</option>
          <option value="PHISHING">Phishing</option>
          <option value="UNAUTHORIZED_ACCESS">Unauthorized Access</option>
          <option value="AVAILABILITY">Availability</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Severity *</label>
        <select id="a-severity">
          <option value="">Select…</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Detected At</label>
        <input id="a-detected" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label>Reported By</label>
        <select id="a-reporter"><option value="">Select…</option></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAdd()">Report Incident</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Update Incident</h3>
    <input type="hidden" id="e-id"/>
    <div class="form-group">
      <label>Title</label>
      <input id="e-title" type="text"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="e-desc"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="e-type">
          <option value="DATA_BREACH">Data Breach</option>
          <option value="MALWARE">Malware</option>
          <option value="PHISHING">Phishing</option>
          <option value="UNAUTHORIZED_ACCESS">Unauthorized Access</option>
          <option value="AVAILABILITY">Availability</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Severity</label>
        <select id="e-severity">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="e-status">
          <option value="OPEN">Open</option>
          <option value="INVESTIGATING">Investigating</option>
          <option value="CONTAINED">Contained</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Assigned To</label>
        <select id="e-assignee"><option value="">Unassigned</option></select>
      </div>
    </div>
    <div class="section-divider">Root Cause Analysis</div>
    <div class="form-group">
      <label>Root Cause</label>
      <textarea id="e-rootcause" placeholder="Identified root cause…"></textarea>
    </div>
    <div class="form-group">
      <label>Lessons Learned</label>
      <textarea id="e-lessons" placeholder="What did we learn?"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Resolved At</label>
        <input id="e-resolved" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label>RCA Completed</label>
        <select id="e-rca">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var state = { incidents: [], staff: [] };

function api(func, params) {
  params = params || {};
  return fetch('/api/v1/incidents', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ _func: func }, params))
  }).then(function(r) { if (r.status === 401) location.href = 'index.html'; return r.json(); });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#dc2626' : '#1e293b';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

var STATUS_PILL = { OPEN:'badge-open', INVESTIGATING:'badge-investigating', CONTAINED:'badge-contained', RESOLVED:'badge-resolved', CLOSED:'badge-closed' };
var SEV_PILL = { LOW:'badge-low', MEDIUM:'badge-medium', HIGH:'badge-high', CRITICAL:'badge-critical' };

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function fmtDateTimeLocal(s) {
  if (!s) return '';
  var d = new Date(s);
  var pad = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function renderTable(rows) {
  var tb = document.getElementById('inc-tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="10" class="empty-state">No incidents found</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function(r) {
    var rcaBadge = r.rca_completed ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>';
    return '<tr>' +
      '<td style="font-family:monospace;font-size:.8rem">' + esc(r.incident_number || '—') + '</td>' +
      '<td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(r.title) + '">' + esc(r.title) + '</td>' +
      '<td>' + esc((r.incident_type||'').replace(/_/g,' ')) + '</td>' +
      '<td><span class="badge ' + (SEV_PILL[r.severity]||'') + '">' + esc(r.severity||'—') + '</span></td>' +
      '<td><span class="badge ' + (STATUS_PILL[r.status]||'') + '">' + esc((r.status||'').replace('_',' ')) + '</span></td>' +
      '<td>' + rcaBadge + '</td>' +
      '<td>' + esc(r.reporter_name || '—') + '</td>' +
      '<td style="white-space:nowrap">' + fmtDate(r.detected_at) + '</td>' +
      '<td style="white-space:nowrap">' + fmtDate(r.resolved_at) + '</td>' +
      '<td><button class="btn btn-sm btn-secondary" onclick=\'openEdit(' + JSON.stringify(r) + ')\'>Edit</button></td>' +
      '</tr>';
  }).join('');
}

function applyFilters() {
  var status = document.getElementById('f-status').value;
  var severity = document.getElementById('f-severity').value;
  var type = document.getElementById('f-type').value;
  var search = document.getElementById('f-search').value.toLowerCase();
  var filtered = state.incidents.filter(function(r) {
    if (status && r.status !== status) return false;
    if (severity && r.severity !== severity) return false;
    if (type && r.incident_type !== type) return false;
    if (search && !((r.title||'').toLowerCase().includes(search) ||
        (r.incident_number||'').toLowerCase().includes(search))) return false;
    return true;
  });
  renderTable(filtered);
}

function populateSelect(id, items, valKey, labelKey, placeholder) {
  var sel = document.getElementById(id);
  var first = placeholder ? '<option value="">' + placeholder + '</option>' : '';
  sel.innerHTML = first + items.map(function(i) {
    return '<option value="' + esc(i[valKey]) + '">' + esc(i[labelKey]) + '</option>';
  }).join('');
}

function loadPage() {
  return Promise.all([
    api('list_incidents'),
    api('list_staff')
  ]).then(function(results) {
    var incRes = results[0], staffRes = results[1];
    if (incRes.success) {
      state.incidents = incRes.data || [];
      renderTable(state.incidents);
    }
    if (staffRes.success) {
      state.staff = staffRes.data || [];
      populateSelect('a-reporter', state.staff, 'id', 'name', 'Select…');
      populateSelect('e-assignee', state.staff, 'id', 'name', 'Unassigned');
    }
  });
}

function openAdd() {
  ['a-title','a-desc'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('a-type').value = '';
  document.getElementById('a-severity').value = '';
  document.getElementById('a-detected').value = '';
  document.getElementById('a-reporter').value = '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

function submitAdd() {
  var title = document.getElementById('a-title').value.trim();
  var desc = document.getElementById('a-desc').value.trim();
  var type = document.getElementById('a-type').value;
  var severity = document.getElementById('a-severity').value;
  if (!title || !desc || !type || !severity) { toast('Title, description, type, and severity are required', true); return; }
  api('add_incident', {
    title: title,
    description: desc,
    incident_type: type,
    severity: severity,
    detected_at: document.getElementById('a-detected').value || null,
    reported_by: document.getElementById('a-reporter').value || null
  }).then(function(res) {
    if (res.success) { toast('Incident reported'); closeAdd(); loadPage(); }
    else toast(res.message || 'Error reporting incident', true);
  });
}

function openEdit(r) {
  document.getElementById('e-id').value = r.id;
  document.getElementById('e-title').value = r.title || '';
  document.getElementById('e-desc').value = r.description || '';
  document.getElementById('e-type').value = r.incident_type || 'OTHER';
  document.getElementById('e-severity').value = r.severity || 'MEDIUM';
  document.getElementById('e-status').value = r.status || 'OPEN';
  document.getElementById('e-assignee').value = r.assigned_to || '';
  document.getElementById('e-rootcause').value = r.root_cause || '';
  document.getElementById('e-lessons').value = r.lessons_learned || '';
  document.getElementById('e-resolved').value = fmtDateTimeLocal(r.resolved_at);
  document.getElementById('e-rca').value = r.rca_completed ? 'true' : 'false';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

function submitEdit() {
  var id = document.getElementById('e-id').value;
  api('update_incident', {
    id: id,
    title: document.getElementById('e-title').value.trim(),
    description: document.getElementById('e-desc').value.trim(),
    incident_type: document.getElementById('e-type').value,
    severity: document.getElementById('e-severity').value,
    status: document.getElementById('e-status').value,
    assigned_to: document.getElementById('e-assignee').value || null,
    root_cause: document.getElementById('e-rootcause').value.trim(),
    lessons_learned: document.getElementById('e-lessons').value.trim(),
    resolved_at: document.getElementById('e-resolved').value || null,
    rca_completed: document.getElementById('e-rca').value
  }).then(function(res) {
    if (res.success) { toast('Incident updated'); closeEdit(); loadPage(); }
    else toast(res.message || 'Error updating incident', true);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeAdd(); closeEdit(); }
});

loadPage();
</script>
</body>
</html>
