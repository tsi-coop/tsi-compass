<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Compass – Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--ink:#172033;--muted:#607086;--line:#d9e2ec;--wash:#f3f7f8;--teal:#006a67;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--wash);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:32px;text-align:center}
.brand-row{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;color:var(--ink)}
.brand-tag{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.mark{width:40px;height:40px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex-shrink:0}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:14px;padding:32px;width:100%;max-width:420px}
.card h1{margin:0 0 22px;font-size:20px;font-weight:900}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--teal)}
.recover{display:block;text-align:right;font-size:11px;font-weight:700;color:var(--teal);text-decoration:none;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.recover:hover{text-decoration:underline}
.error-box{display:none;margin-bottom:14px;padding:10px 14px;border-radius:7px;background:#fef2f2;border:1px solid #fde8e8;font-size:12px;font-weight:600;color:var(--red)}
.btn{width:100%;height:44px;background:var(--teal);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;font-family:inherit}
.btn:hover{background:#005450}
.btn:disabled{opacity:.6;cursor:not-allowed}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-row">
    <span class="mark">TC</span>
    <span>TSI Compass</span>
  </div>
  <span class="brand-tag">The beginner's open source GRC platform.</span>
</div>

<div class="card">
  <h1>Sign In</h1>

  <form onsubmit="handleLogin(event)">
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password">
    </div>

    <a href="password-reset.html" class="recover">Forgot password?</a>

    <div class="error-box" id="login-error"></div>

    <button type="submit" class="btn" id="login-btn">Sign In</button>
  </form>
</div>

<script>
function handleLogin(event) {
  event.preventDefault();
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn      = document.getElementById('login-btn');
  var errBox   = document.getElementById('login-error');

  errBox.style.display = 'none';
  errBox.textContent = '';

  if (!email || !password) {
    errBox.textContent = 'Please enter your email address and password.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';

  fetch('/api/v1/admin/user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ _func: 'login', email: email, password: password })
  })
  .then(function(r) { return r.json().then(function(data) { return { status: r.status, body: data }; }); })
  .then(function(res) {
    if (res.status === 200 && res.body.success) {
      localStorage.setItem('token',       res.body.token);
      localStorage.setItem('username',    res.body.username);
      localStorage.setItem('role',        res.body.role);
      localStorage.setItem('permissions', JSON.stringify(res.body.permissions || {}));
      window.location.href = 'console/dashboard.html';
    } else {
      var msg = (res.body && res.body.message) ? res.body.message : 'Sign in failed. Please try again.';
      errBox.textContent = msg;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  })
  .catch(function() {
    errBox.textContent = 'Unable to reach the server. Please check your connection.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  });
}
</script>
</body>
</html>
