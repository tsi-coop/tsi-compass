<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Helpdesk Tickets — TSI Compass</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .filter-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
    .filter-bar select,.filter-bar input{padding:.45rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--card);color:var(--text)}
    .filter-bar input{flex:1;min-width:180px}
    .badge{display:inline-block;padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .badge-open{background:#fef3c7;color:#92400e}
    .badge-in_progress{background:#dbeafe;color:#1e40af}
    .badge-resolved{background:#d1fae5;color:#065f46}
    .badge-closed{background:#f3f4f6;color:#6b7280}
    .badge-low{background:#f0fdf4;color:#166534}
    .badge-medium{background:#fef9c3;color:#854d0e}
    .badge-high{background:#fee2e2;color:#991b1b}
    .badge-critical{background:#fce7f3;color:#9d174d}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th{background:var(--sidebar-bg);padding:.65rem 1rem;text-align:left;font-weight:600;color:var(--text-muted);white-space:nowrap}
    td{padding:.7rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:hover td{background:var(--hover)}
    .btn{padding:.45rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--border);color:var(--text)}
    .btn-sm{padding:.3rem .65rem;font-size:.78rem}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border-radius:10px;padding:2rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
    .modal h3{margin:0 0 1.25rem;font-size:1.05rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--text-muted)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.875rem;background:var(--bg);color:var(--text);box-sizing:border-box}
    .form-group textarea{resize:vertical;min-height:80px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .modal-actions{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-size:.85rem;z-index:999;display:none}
    .toast.show{display:block}
    .empty-state{text-align:center;padding:3rem;color:var(--text-muted)}
  </style>
</head>
<body>
<div id="app-shell"></div>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
</script>
<script src="js/shell.js"></script>

<div class="main-content" style="padding:1.5rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.25rem">
        <a href="operations.html" style="color:var(--accent);text-decoration:none">IT Operations</a> › Helpdesk Tickets
      </div>
      <h2 style="margin:0;font-size:1.3rem">Helpdesk Tickets</h2>
    </div>
    <button class="btn btn-primary" onclick="openAdd()">+ New Ticket</button>
  </div>

  <div class="filter-bar">
    <select id="f-status" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="OPEN">Open</option>
      <option value="IN_PROGRESS">In Progress</option>
      <option value="RESOLVED">Resolved</option>
      <option value="CLOSED">Closed</option>
    </select>
    <select id="f-priority" onchange="applyFilters()">
      <option value="">All Priorities</option>
      <option value="LOW">Low</option>
      <option value="MEDIUM">Medium</option>
      <option value="HIGH">High</option>
      <option value="CRITICAL">Critical</option>
    </select>
    <select id="f-category" onchange="applyFilters()">
      <option value="">All Categories</option>
      <option value="ACCESS">Access</option>
      <option value="HARDWARE">Hardware</option>
      <option value="SOFTWARE">Software</option>
      <option value="NETWORK">Network</option>
      <option value="SECURITY">Security</option>
      <option value="OTHER">Other</option>
    </select>
    <input id="f-search" type="text" placeholder="Search tickets…" oninput="applyFilters()"/>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticket #</th>
          <th>Title</th>
          <th>Category</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Requester</th>
          <th>Assigned To</th>
          <th>Created</th>
          <th>Resolved</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ticket-tbody">
        <tr><td colspan="10" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>New Helpdesk Ticket</h3>
    <div class="form-group">
      <label>Title *</label>
      <input id="a-title" type="text" placeholder="Brief description of the issue"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="a-desc" placeholder="Detailed description…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select id="a-category">
          <option value="">Select…</option>
          <option value="ACCESS">Access</option>
          <option value="HARDWARE">Hardware</option>
          <option value="SOFTWARE">Software</option>
          <option value="NETWORK">Network</option>
          <option value="SECURITY">Security</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority *</label>
        <select id="a-priority">
          <option value="">Select…</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Requester</label>
        <select id="a-requester"><option value="">Select…</option></select>
      </div>
      <div class="form-group">
        <label>Assigned To</label>
        <select id="a-assignee"><option value="">Unassigned</option></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAdd()">Create Ticket</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Update Ticket</h3>
    <input type="hidden" id="e-id"/>
    <div class="form-group">
      <label>Title</label>
      <input id="e-title" type="text"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="e-desc"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="e-category">
          <option value="ACCESS">Access</option>
          <option value="HARDWARE">Hardware</option>
          <option value="SOFTWARE">Software</option>
          <option value="NETWORK">Network</option>
          <option value="SECURITY">Security</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="e-priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="e-status">
          <option value="OPEN">Open</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Assigned To</label>
        <select id="e-assignee"><option value="">Unassigned</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>Resolution Notes</label>
      <textarea id="e-resolution" placeholder="How was this resolved?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { tickets: [], staff: [] };

function api(func, params) {
  params = params || {};
  return fetch('/api/v1/ops', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ _func: func }, params))
  }).then(function(r) { if (r.status === 401) location.href = 'index.html'; return r.json(); });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#dc2626' : '#1e293b';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

var STATUS_PILL = { OPEN:'badge-open', IN_PROGRESS:'badge-in_progress', RESOLVED:'badge-resolved', CLOSED:'badge-closed' };
var PRIO_PILL = { LOW:'badge-low', MEDIUM:'badge-medium', HIGH:'badge-high', CRITICAL:'badge-critical' };

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function renderTable(rows) {
  var tb = document.getElementById('ticket-tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="10" class="empty-state">No tickets found</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function(r) {
    return '<tr>' +
      '<td style="font-family:monospace;font-size:.8rem">' + esc(r.ticket_number || '—') + '</td>' +
      '<td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(r.title) + '">' + esc(r.title) + '</td>' +
      '<td>' + esc(r.category || '—') + '</td>' +
      '<td><span class="badge ' + (PRIO_PILL[r.priority] || '') + '">' + esc(r.priority || '—') + '</span></td>' +
      '<td><span class="badge ' + (STATUS_PILL[r.status] || '') + '">' + esc((r.status || '').replace('_',' ')) + '</span></td>' +
      '<td>' + esc(r.requester_name || '—') + '</td>' +
      '<td>' + esc(r.assignee_name || 'Unassigned') + '</td>' +
      '<td style="white-space:nowrap">' + fmtDate(r.created_at) + '</td>' +
      '<td style="white-space:nowrap">' + fmtDate(r.resolved_at) + '</td>' +
      '<td><button class="btn btn-sm btn-secondary" onclick=\'openEdit(' + JSON.stringify(r) + ')\'>Edit</button></td>' +
      '</tr>';
  }).join('');
}

function applyFilters() {
  var status = document.getElementById('f-status').value;
  var priority = document.getElementById('f-priority').value;
  var category = document.getElementById('f-category').value;
  var search = document.getElementById('f-search').value.toLowerCase();
  var filtered = state.tickets.filter(function(r) {
    if (status && r.status !== status) return false;
    if (priority && r.priority !== priority) return false;
    if (category && r.category !== category) return false;
    if (search && !((r.title||'').toLowerCase().includes(search) ||
        (r.ticket_number||'').toLowerCase().includes(search) ||
        (r.requester_name||'').toLowerCase().includes(search))) return false;
    return true;
  });
  renderTable(filtered);
}

function populateSelect(id, items, valKey, labelKey, placeholder) {
  var sel = document.getElementById(id);
  var first = placeholder ? '<option value="">' + placeholder + '</option>' : '';
  sel.innerHTML = first + items.map(function(i) {
    return '<option value="' + esc(i[valKey]) + '">' + esc(i[labelKey]) + '</option>';
  }).join('');
}

function loadPage() {
  return Promise.all([
    api('list_tickets'),
    api('list_staff')
  ]).then(function(results) {
    var ticketsRes = results[0], staffRes = results[1];
    if (ticketsRes.success) {
      state.tickets = ticketsRes.data || [];
      renderTable(state.tickets);
    }
    if (staffRes.success) {
      state.staff = staffRes.data || [];
      populateSelect('a-requester', state.staff, 'id', 'name', 'Select…');
      populateSelect('a-assignee', state.staff, 'id', 'name', 'Unassigned');
      populateSelect('e-assignee', state.staff, 'id', 'name', 'Unassigned');
    }
  });
}

function openAdd() {
  document.getElementById('a-title').value = '';
  document.getElementById('a-desc').value = '';
  document.getElementById('a-category').value = '';
  document.getElementById('a-priority').value = '';
  document.getElementById('a-requester').value = '';
  document.getElementById('a-assignee').value = '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

function submitAdd() {
  var title = document.getElementById('a-title').value.trim();
  var category = document.getElementById('a-category').value;
  var priority = document.getElementById('a-priority').value;
  if (!title || !category || !priority) { toast('Title, category, and priority are required', true); return; }
  api('add_ticket', {
    title: title,
    description: document.getElementById('a-desc').value.trim(),
    category: category,
    priority: priority,
    requester_id: document.getElementById('a-requester').value || null,
    assignee_id: document.getElementById('a-assignee').value || null
  }).then(function(res) {
    if (res.success) { toast('Ticket created'); closeAdd(); loadPage(); }
    else toast(res.message || 'Error creating ticket', true);
  });
}

function openEdit(r) {
  document.getElementById('e-id').value = r.id;
  document.getElementById('e-title').value = r.title || '';
  document.getElementById('e-desc').value = r.description || '';
  document.getElementById('e-category').value = r.category || 'OTHER';
  document.getElementById('e-priority').value = r.priority || 'MEDIUM';
  document.getElementById('e-status').value = r.status || 'OPEN';
  document.getElementById('e-assignee').value = r.assignee_id || '';
  document.getElementById('e-resolution').value = r.resolution_notes || '';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

function submitEdit() {
  var id = document.getElementById('e-id').value;
  api('update_ticket', {
    id: id,
    title: document.getElementById('e-title').value.trim(),
    description: document.getElementById('e-desc').value.trim(),
    category: document.getElementById('e-category').value,
    priority: document.getElementById('e-priority').value,
    status: document.getElementById('e-status').value,
    assignee_id: document.getElementById('e-assignee').value || null,
    resolution_notes: document.getElementById('e-resolution').value.trim()
  }).then(function(res) {
    if (res.success) { toast('Ticket updated'); closeEdit(); loadPage(); }
    else toast(res.message || 'Error updating ticket', true);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeAdd(); closeEdit(); }
});

loadPage();
</script>
</body>
</html>
