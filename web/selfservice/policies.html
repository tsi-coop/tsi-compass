<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Compass – Policies</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--ink:#172033;--muted:#607086;--line:#d9e2ec;--wash:#f3f7f8;--teal:#006a67;--blue:#2457a6;--amber:#b7791f;--green:#27794f;--red:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--wash)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}.mark{width:32px;height:32px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0}
.nav{display:flex;gap:2px}.nav a{padding:9px 14px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:700}
.nav a:hover,.nav a.active{background:#eaf5f3;color:var(--teal)}
.user{display:flex;align-items:center;gap:10px}
#nb-wrap{top:72px!important;right:22px!important}
.user-name{font-size:12.5px;font-weight:700;display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.signout{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#b42318;border:1px solid #fde8e8;background:#fef2f2}
.signout:hover{background:#fde8e8}
.main{padding:32px;max-width:1000px;margin:0 auto}
.page-header{margin-bottom:24px}
.eyebrow{color:var(--teal);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:900}.subtitle{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}
.section-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.section-head h2{margin:0;font-size:14px;font-weight:800}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid #f0f4f8;vertical-align:middle}tr:last-child td{border-bottom:none}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill.good{background:#e6f4ed;color:var(--green)}.pill.watch{background:#fef3cd;color:var(--amber)}
.tag{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;background:#f0f4f8;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.filter-bar{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}
.filter-bar input{flex:1;height:32px;border:1px solid var(--line);border-radius:6px;font-size:12px;padding:0 10px;color:var(--ink);background:#fff}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.pagination span{font-size:12px;color:var(--muted)}
.page-btns{display:flex;gap:6px}
.page-btn{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.page-btn.active{background:var(--teal);border-color:var(--teal);color:#fff}
.page-btn:disabled{opacity:.45;cursor:default}
@media(max-width:820px){.nav{display:none}.main{padding:20px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">TC</span><span>TSI Compass</span></a>
  <nav class="nav">
    <a href="index.html">My Requests</a>
    <a href="team-tickets.html" id="nav-team-tickets" style="display:none">Team Requests</a>
    <a href="approvals.html" id="nav-approvals" style="display:none">Approvals</a>
    <a href="team.html" id="nav-team" style="display:none">My Team</a>
    <a href="policies.html" class="active">Policies</a>
    <a href="training.html">Training</a>
  </nav>
  <div class="user">
    <span class="user-name" id="user-name">-</span>
    <a href="../index.html" class="signout" onclick="localStorage.clear();return true;" title="Sign Out" aria-label="Sign Out"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
  </div>
</header>
<main class="main">
  <div class="page-header">
    <div class="eyebrow">Self-Service Portal</div>
    <h1>Policies</h1>
    <p class="subtitle">Review and acknowledge published company policies.</p>
  </div>

  <div class="section-card">
    <div class="section-head"><h2>Pending Acknowledgement</h2><span id="pending-count" style="font-size:12px;color:var(--muted)"></span></div>
    <div class="filter-bar"><input id="search-pending" type="search" placeholder="Search pending policies…" oninput="onPendingSearch()"></div>
    <table>
      <thead><tr><th>Title</th><th>Type</th><th>Version</th><th></th></tr></thead>
      <tbody id="pending-body"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
    <div class="pagination"><span id="page-info-pending">-</span><div class="page-btns" id="page-btns-pending"></div></div>
  </div>

  <div class="section-card">
    <div class="section-head"><h2>Acknowledged</h2></div>
    <div class="filter-bar"><input id="search-ack" type="search" placeholder="Search acknowledged policies…" oninput="onAckSearch()"></div>
    <table>
      <thead><tr><th>Title</th><th>Type</th><th>Version</th><th>Acknowledged</th></tr></thead>
      <tbody id="ack-body"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
    <div class="pagination"><span id="page-info-ack">-</span><div class="page-btns" id="page-btns-ack"></div></div>
  </div>
</main>

<script>
var TOKEN = localStorage.getItem('token');
if (!TOKEN) window.location.href = '../index.html';

function api(func, body, cb) {
  fetch('/api/v1/admin/selfservice', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify(Object.assign({ _func: func }, body || {}))
  })
  .then(function(r) {
    if (r.status === 401) { localStorage.removeItem('token'); window.location.href = '../index.html'; return; }
    return r.json();
  })
  .then(function(d) { if (!d) return; if (!d.success) cb(d.message || 'Error', null); else cb(null, d); })
  .catch(function(e) { cb(e.message || 'Network error', null); });
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildPageList(current, total) {
  if (total <= 7) { var arr = []; for (var i = 1; i <= total; i++) arr.push(i); return arr; }
  var set = [1, total, current];
  if (current - 1 > 1) set.push(current - 1);
  if (current + 1 < total) set.push(current + 1);
  if (current - 2 > 1) set.push(current - 2);
  if (current + 2 < total) set.push(current + 2);
  var unique = set.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort(function(a, b) { return a - b; });
  var result = [];
  for (var j = 0; j < unique.length; j++) {
    if (j > 0 && unique[j] - unique[j - 1] > 1) result.push('…');
    result.push(unique[j]);
  }
  return result.slice(0, 9);
}

function renderPagination(data, infoId, btnsId, noun, loadFn) {
  var total = data.total_count || 0;
  var page = data.page || 1;
  var pageSize = data.page_size || 20;
  var totalPages = data.total_pages || Math.ceil(total / pageSize) || 1;
  var from = total === 0 ? 0 : (page - 1) * pageSize + 1;
  var to = Math.min(page * pageSize, total);
  document.getElementById(infoId).textContent = 'Showing ' + from + '–' + to + ' of ' + total + ' ' + noun + (total !== 1 ? 's' : '');
  var btnsEl = document.getElementById(btnsId);
  btnsEl.innerHTML = '';
  if (totalPages <= 1) return;
  buildPageList(page, totalPages).forEach(function(p) {
    var btn = document.createElement('button');
    btn.className = 'page-btn' + (p === page ? ' active' : '');
    btn.textContent = p === '…' ? '…' : String(p);
    if (p === '…') { btn.disabled = true; }
    else { (function(pg) { btn.onclick = function() { loadFn(pg); }; })(p); }
    btnsEl.appendChild(btn);
  });
}

var _pendingPage = 1, _ackPage = 1;
var _pendingSearchDebounce = null;
function onPendingSearch() { clearTimeout(_pendingSearchDebounce); _pendingSearchDebounce = setTimeout(function() { loadPending(1); }, 300); }
var _ackSearchDebounce = null;
function onAckSearch() { clearTimeout(_ackSearchDebounce); _ackSearchDebounce = setTimeout(function() { loadAck(1); }, 300); }

function loadPending(page) {
  _pendingPage = page || 1;
  var reqBody = { page: _pendingPage, limit: 20 };
  var search = document.getElementById('search-pending').value.trim();
  if (search) reqBody.search = search;
  api('list_pending_policies', reqBody, function(err, d) {
    var body = document.getElementById('pending-body');
    var cnt = document.getElementById('pending-count');
    if (err) { body.innerHTML = '<tr><td colspan="4" class="empty">' + esc(err) + '</td></tr>'; return; }
    var list = d.policies || [];
    if (cnt) cnt.textContent = (d.total_count || 0) + ' pending';
    if (!list.length) { body.innerHTML = '<tr><td colspan="4" class="empty">Nothing pending - you\'re all caught up.</td></tr>'; document.getElementById('page-info-pending').textContent = '-'; document.getElementById('page-btns-pending').innerHTML = ''; return; }
    body.innerHTML = list.map(function(p) {
      return '<tr><td><strong>' + esc(p.title) + '</strong></td>' +
        '<td><span class="tag">' + esc(p.type) + '</span></td>' +
        '<td>' + esc(p.version || '-') + '</td>' +
        '<td><button class="btn primary" onclick="acknowledge(\'' + p.id + '\', this)">Acknowledge</button></td></tr>';
    }).join('');
    renderPagination(d, 'page-info-pending', 'page-btns-pending', 'policy', loadPending);
  });
}

function loadAck(page) {
  _ackPage = page || 1;
  var reqBody = { page: _ackPage, limit: 20 };
  var search = document.getElementById('search-ack').value.trim();
  if (search) reqBody.search = search;
  api('list_my_attestations', reqBody, function(err, d) {
    var body = document.getElementById('ack-body');
    if (err) { body.innerHTML = '<tr><td colspan="4" class="empty">' + esc(err) + '</td></tr>'; return; }
    var list = d.attestations || [];
    if (!list.length) { body.innerHTML = '<tr><td colspan="4" class="empty">No acknowledged policies yet.</td></tr>'; document.getElementById('page-info-ack').textContent = '-'; document.getElementById('page-btns-ack').innerHTML = ''; return; }
    body.innerHTML = list.map(function(p) {
      return '<tr><td><strong>' + esc(p.title) + '</strong></td>' +
        '<td><span class="tag">' + esc(p.type) + '</span></td>' +
        '<td>' + esc(p.version || '-') + '</td>' +
        '<td><span class="pill good">' + esc(p.acknowledged_at || '-') + '</span></td></tr>';
    }).join('');
    renderPagination(d, 'page-info-ack', 'page-btns-ack', 'policy', loadAck);
  });
}

function acknowledge(policyId, btn) {
  btn.disabled = true; btn.textContent = 'Acknowledging…';
  api('acknowledge_policy', { policy_id: policyId }, function(err) {
    if (err) { alert('Error: ' + err); btn.disabled = false; btn.textContent = 'Acknowledge'; return; }
    loadPending(_pendingPage);
    loadAck(_ackPage);
  });
}

(function() {
  var n = localStorage.getItem('username') || 'User';
  var nm = document.getElementById('user-name');
  if (nm) { nm.textContent = n; nm.title = n; }
  loadPending(1);
  loadAck(1);
})();
</script>
<script src="nav.js"></script>
<script src="../console/notifications.js"></script>
</body>
</html>
