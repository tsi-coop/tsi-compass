<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Compass – New Ticket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--ink:#172033;--muted:#607086;--line:#d9e2ec;--wash:#f3f7f8;--teal:#006a67;--red:#b42318;--green:#27794f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--wash)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}.mark{width:32px;height:32px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0}
.nav{display:flex;gap:2px}.nav a{padding:9px 14px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:700}
.nav a:hover,.nav a.active{background:#eaf5f3;color:var(--teal)}
.user{display:flex;align-items:center;gap:10px}
#nb-wrap{top:72px!important;right:22px!important}
.user-name{font-size:12.5px;font-weight:700;display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.signout{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#b42318;border:1px solid #fde8e8;background:#fef2f2}
.signout:hover{background:#fde8e8}
.main{padding:32px;max-width:640px;margin:0 auto}
.page-header{margin-bottom:24px}
.eyebrow{color:var(--teal);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:900}.subtitle{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.form-row input,.form-row select,.form-row textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;color:var(--ink);font-family:inherit}
.form-row textarea{height:110px;padding:8px 10px;resize:vertical}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:12.5px;font-weight:600;margin-bottom:14px;padding:10px 12px;border-radius:7px;display:none}
.msg.err{background:#fef2f2;border:1px solid #fde8e8;color:var(--red)}
.msg.ok{background:#eaf7ef;border:1px solid #c8ecd6;color:var(--green)}
@media(max-width:820px){.nav{display:none}.main{padding:20px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">TC</span><span>TSI Compass</span></a>
  <nav class="nav">
    <a href="index.html">My Requests</a>
    <a href="new-ticket.html" class="active">New Ticket</a>
    <a href="new-change.html">New Change</a>
    <a href="policies.html">Policies</a>
    <a href="training.html">Training</a>
    <a href="team.html" id="nav-team" style="display:none">My Team</a>
    <a href="approvals.html" id="nav-approvals" style="display:none">Approvals</a>
  </nav>
  <div class="user">
    <span class="user-name" id="user-name">-</span>
    <a href="../index.html" class="signout" onclick="localStorage.clear();return true;" title="Sign Out" aria-label="Sign Out"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
  </div>
</header>
<main class="main">
  <div class="page-header">
    <div class="eyebrow">Self-Service Portal</div>
    <h1>New Helpdesk Ticket</h1>
    <p class="subtitle">Report an IT issue. It will be routed to IT Staff for triage.</p>
  </div>
  <div class="card">
    <div class="msg err" id="err-box"></div>
    <div class="msg ok" id="ok-box"></div>
    <form id="ticket-form" onsubmit="submitTicket(event)">
      <div class="form-row"><label>Title</label><input id="t-title" required></div>
      <div class="form-row"><label>Description</label><textarea id="t-desc" required></textarea></div>
      <div class="form-row"><label>Category</label>
        <select id="t-category" required onchange="loadSubcategories()"><option value="">Loading…</option></select>
      </div>
      <div class="form-row" id="subcategory-row" style="display:none"><label>Subcategory</label>
        <select id="t-subcategory"></select>
      </div>
      <div class="form-row"><label>Priority</label>
        <select id="t-priority"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select>
      </div>
      <div class="foot">
        <a class="btn" href="index.html">Cancel</a>
        <button type="submit" class="btn primary" id="submit-btn">Submit Ticket</button>
      </div>
    </form>
  </div>
</main>

<script>
var TOKEN = localStorage.getItem('token');
if (!TOKEN) window.location.href = '../index.html';

function api(func, body, cb) {
  fetch('/api/v1/admin/selfservice', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify(Object.assign({ _func: func }, body || {}))
  })
  .then(function(r) {
    if (r.status === 401) { localStorage.removeItem('token'); window.location.href = '../index.html'; return; }
    return r.json();
  })
  .then(function(d) { if (!d) return; if (!d.success) cb(d.message || 'Error', null); else cb(null, d); })
  .catch(function(e) { cb(e.message || 'Network error', null); });
}

function submitTicket(e) {
  e.preventDefault();
  var errBox = document.getElementById('err-box'), okBox = document.getElementById('ok-box');
  errBox.style.display = 'none'; okBox.style.display = 'none';
  var title = document.getElementById('t-title').value.trim();
  var desc  = document.getElementById('t-desc').value.trim();
  var categoryId = document.getElementById('t-category').value;
  var subcategoryId = document.getElementById('t-subcategory').value;
  var priority = document.getElementById('t-priority').value;
  if (!title || !desc) { errBox.textContent = 'Title and description are required.'; errBox.style.display = 'block'; return; }
  if (!categoryId) { errBox.textContent = 'Category is required.'; errBox.style.display = 'block'; return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  api('create_ticket', { title: title, description: desc, category_id: categoryId, subcategory_id: subcategoryId || null, priority: priority }, function(err) {
    btn.disabled = false; btn.textContent = 'Submit Ticket';
    if (err) { errBox.textContent = err; errBox.style.display = 'block'; return; }
    okBox.textContent = 'Ticket submitted. Redirecting to My Requests…';
    okBox.style.display = 'block';
    setTimeout(function() { window.location.href = 'index.html'; }, 900);
  });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadCategories() {
  var sel = document.getElementById('t-category');
  api('list_ticket_categories', {}, function(err, d) {
    if (err || !d || !d.categories || !d.categories.length) {
      sel.innerHTML = '<option value="">No categories available - contact your administrator</option>';
      return;
    }
    sel.innerHTML = '<option value="">Select a category…</option>' +
      d.categories.map(function(c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('');
  });
}

function loadSubcategories() {
  var categoryId = document.getElementById('t-category').value;
  var row = document.getElementById('subcategory-row');
  var sel = document.getElementById('t-subcategory');
  if (!categoryId) { row.style.display = 'none'; sel.innerHTML = ''; return; }
  api('list_ticket_subcategories', { category_id: categoryId }, function(err, d) {
    var list = (!err && d && d.subcategories) ? d.subcategories : [];
    if (!list.length) { row.style.display = 'none'; sel.innerHTML = ''; return; }
    sel.innerHTML = '<option value="">Select a subcategory… (optional)</option>' +
      list.map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');
    row.style.display = 'block';
  });
}

(function() {
  var n = localStorage.getItem('username') || 'User';
  var nm = document.getElementById('user-name');
  if (nm) { nm.textContent = n; nm.title = n; }
  loadCategories();
})();
</script>
<script src="nav.js"></script>
<script src="../console/notifications.js"></script>
</body>
</html>
