<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Knowledge Base — TSI Compass</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .filter-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
    .filter-bar select,.filter-bar input{padding:.45rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--card);color:var(--text)}
    .filter-bar input{flex:1;min-width:180px}
    .badge{display:inline-block;padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .badge-draft{background:#f3f4f6;color:#6b7280}
    .badge-published{background:#d1fae5;color:#065f46}
    .badge-archived{background:#dbeafe;color:#1e40af}
    .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}
    .article-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column}
    .article-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
    .article-card-title{font-weight:600;font-size:.95rem;line-height:1.35;flex:1}
    .article-category{display:inline-block;font-size:.72rem;color:var(--text-muted);background:var(--sidebar-bg);padding:.15rem .5rem;border-radius:4px;margin-bottom:.5rem}
    .article-excerpt{font-size:.82rem;color:var(--text-muted);line-height:1.5;flex:1;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .article-meta{font-size:.75rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:.65rem;display:flex;justify-content:space-between;align-items:center}
    .card-actions{display:flex;gap:.5rem;margin-top:.65rem}
    .btn{padding:.45rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--border);color:var(--text)}
    .btn-sm{padding:.3rem .65rem;font-size:.78rem}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border-radius:10px;padding:2rem;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
    .modal h3{margin:0 0 1.25rem;font-size:1.05rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--text-muted)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.875rem;background:var(--bg);color:var(--text);box-sizing:border-box}
    .form-group textarea{resize:vertical;min-height:100px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .modal-actions{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-size:.85rem;z-index:999;display:none}
    .toast.show{display:block}
    .empty-state{text-align:center;padding:3rem;color:var(--text-muted)}
  </style>
</head>
<body>
<div id="app-shell"></div>
<script>
var token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
</script>
<script src="js/shell.js"></script>

<div class="main-content" style="padding:1.5rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.25rem">
        <a href="incidents.html" style="color:var(--accent);text-decoration:none">Incidents &amp; Awareness</a> › Knowledge Base
      </div>
      <h2 style="margin:0;font-size:1.3rem">Security Knowledge Base</h2>
    </div>
    <button class="btn btn-primary" onclick="openAdd()">+ New Article</button>
  </div>

  <div class="filter-bar">
    <select id="f-category" onchange="applyFilters()">
      <option value="">All Categories</option>
      <option value="POLICY">Policy</option>
      <option value="PROCEDURE">Procedure</option>
      <option value="GUIDELINE">Guideline</option>
      <option value="RUNBOOK">Runbook</option>
      <option value="LESSON_LEARNED">Lesson Learned</option>
      <option value="OTHER">Other</option>
    </select>
    <select id="f-status" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="PUBLISHED">Published</option>
      <option value="ARCHIVED">Archived</option>
    </select>
    <input id="f-search" type="text" placeholder="Search articles…" oninput="applyFilters()"/>
  </div>

  <div id="articles-grid" class="articles-grid">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>New Knowledge Base Article</h3>
    <div class="form-group">
      <label>Title *</label>
      <input id="a-title" type="text" placeholder="Article title"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select id="a-category">
          <option value="">Select…</option>
          <option value="POLICY">Policy</option>
          <option value="PROCEDURE">Procedure</option>
          <option value="GUIDELINE">Guideline</option>
          <option value="RUNBOOK">Runbook</option>
          <option value="LESSON_LEARNED">Lesson Learned</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Audience</label>
        <input id="a-audience" type="text" placeholder="e.g. All Staff, IT Team…"/>
      </div>
    </div>
    <div class="form-group">
      <label>Content *</label>
      <textarea id="a-content" style="min-height:140px" placeholder="Article content, steps, or description…"></textarea>
    </div>
    <div class="form-group">
      <label>Tags (comma-separated)</label>
      <input id="a-tags" type="text" placeholder="phishing, email, awareness"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAdd()">Publish Article</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Edit Article</h3>
    <input type="hidden" id="e-id"/>
    <div class="form-group">
      <label>Title</label>
      <input id="e-title" type="text"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="e-category">
          <option value="POLICY">Policy</option>
          <option value="PROCEDURE">Procedure</option>
          <option value="GUIDELINE">Guideline</option>
          <option value="RUNBOOK">Runbook</option>
          <option value="LESSON_LEARNED">Lesson Learned</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="e-status">
          <option value="DRAFT">Draft</option>
          <option value="PUBLISHED">Published</option>
          <option value="ARCHIVED">Archived</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Audience</label>
      <input id="e-audience" type="text"/>
    </div>
    <div class="form-group">
      <label>Content</label>
      <textarea id="e-content" style="min-height:140px"></textarea>
    </div>
    <div class="form-group">
      <label>Tags (comma-separated)</label>
      <input id="e-tags" type="text"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var state = { articles: [] };

function api(func, params) {
  params = params || {};
  return fetch('/api/v1/incidents', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ _func: func }, params))
  }).then(function(r) { if (r.status === 401) location.href = 'index.html'; return r.json(); });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#dc2626' : '#1e293b';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

var STATUS_PILL = { DRAFT:'badge-draft', PUBLISHED:'badge-published', ARCHIVED:'badge-archived' };

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function renderCards(rows) {
  var grid = document.getElementById('articles-grid');
  if (!rows.length) {
    grid.innerHTML = '<div class="empty-state">No articles found</div>';
    return;
  }
  grid.innerHTML = rows.map(function(r) {
    var excerpt = (r.content || '').substring(0, 200) + (r.content && r.content.length > 200 ? '…' : '');
    return '<div class="article-card">' +
      '<div class="article-card-top">' +
        '<div class="article-card-title">' + esc(r.title) + '</div>' +
        '<span class="badge ' + (STATUS_PILL[r.status]||'') + '">' + esc(r.status||'—') + '</span>' +
      '</div>' +
      '<span class="article-category">' + esc((r.category||'').replace(/_/g,' ')) + '</span>' +
      '<div class="article-excerpt">' + esc(excerpt) + '</div>' +
      '<div class="article-meta">' +
        '<span>&#128197; ' + fmtDate(r.updated_at || r.created_at) + '</span>' +
        '<span>' + esc(r.audience || '') + '</span>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-sm btn-secondary" onclick=\'openEdit(' + JSON.stringify(r) + ')\'>Edit</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

function applyFilters() {
  var category = document.getElementById('f-category').value;
  var status = document.getElementById('f-status').value;
  var search = document.getElementById('f-search').value.toLowerCase();
  var filtered = state.articles.filter(function(r) {
    if (category && r.category !== category) return false;
    if (status && r.status !== status) return false;
    if (search && !((r.title||'').toLowerCase().includes(search) ||
        (r.content||'').toLowerCase().includes(search) ||
        (r.tags||'').toLowerCase().includes(search))) return false;
    return true;
  });
  renderCards(filtered);
}

function loadPage() {
  api('list_knowledge').then(function(res) {
    if (res.success) {
      state.articles = res.data || [];
      renderCards(state.articles);
    }
  });
}

function openAdd() {
  ['a-title','a-content','a-tags','a-audience'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('a-category').value = '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

function submitAdd() {
  var title = document.getElementById('a-title').value.trim();
  var content = document.getElementById('a-content').value.trim();
  var category = document.getElementById('a-category').value;
  if (!title || !content || !category) { toast('Title, category, and content are required', true); return; }
  api('add_knowledge', {
    title: title,
    content: content,
    category: category,
    audience: document.getElementById('a-audience').value.trim(),
    tags: document.getElementById('a-tags').value.trim(),
    created_by: localStorage.getItem('user_id') || null
  }).then(function(res) {
    if (res.success) { toast('Article published'); closeAdd(); loadPage(); }
    else toast(res.message || 'Error publishing article', true);
  });
}

function openEdit(r) {
  document.getElementById('e-id').value = r.id;
  document.getElementById('e-title').value = r.title || '';
  document.getElementById('e-content').value = r.content || '';
  document.getElementById('e-category').value = r.category || 'OTHER';
  document.getElementById('e-status').value = r.status || 'DRAFT';
  document.getElementById('e-audience').value = r.audience || '';
  document.getElementById('e-tags').value = r.tags || '';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

function submitEdit() {
  var id = document.getElementById('e-id').value;
  api('update_knowledge', {
    id: id,
    title: document.getElementById('e-title').value.trim(),
    content: document.getElementById('e-content').value.trim(),
    category: document.getElementById('e-category').value,
    status: document.getElementById('e-status').value,
    audience: document.getElementById('e-audience').value.trim(),
    tags: document.getElementById('e-tags').value.trim()
  }).then(function(res) {
    if (res.success) { toast('Article updated'); closeEdit(); loadPage(); }
    else toast(res.message || 'Error updating article', true);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeAdd(); closeEdit(); }
});

loadPage();
</script>
</body>
</html>
