<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Compass - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;800;900&display=swap');
        
        :root {
            --ink: #172033;
            --muted: #607086;
            --line: #d9e2ec;
            --paper: #ffffff;
            --wash: #f3f7f8;
            --teal: #006a67;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        body {
            background-color: var(--wash);
            color: var(--ink);
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }

        .tsi-panel {
            background-color: var(--paper);
            border: 1px solid var(--line);
            border-top: 4px solid var(--teal);
            box-shadow: var(--shadow);
        }

        .input-focus:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(0, 106, 103, 0.08);
        }
    </style>
</head>

<body>
<div class="w-full max-w-xl p-8 sm:p-12 rounded-2xl tsi-panel">

    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-[#006a67] text-white text-lg font-black rounded-lg mb-4 shadow-sm select-none">
            TC
        </div>
        <h2 class="text-2xl font-black text-[#172033] tracking-tight">TSI Compass</h2>
        <p class="text-[11px] text-[#607086] font-bold uppercase tracking-[0.15em] mt-1.5">GRC made simple</p>
        <div class="w-12 h-0.5 bg-[#d9e2ec] mx-auto mt-4"></div>
        <h1 class="text-xs font-black mt-4 text-[#006a67] uppercase tracking-widest">Navigate. Control. Comply.</h1>
    </div>

    <form onsubmit="handleLogin(event)">
        <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-start space-y-1.5 sm:space-y-0">
                <label for="email" class="sm:w-1/3 block text-[11px] font-extrabold text-[#607086] uppercase tracking-wider sm:pt-3.5 px-1">
                    Email Address
                </label>
                <div class="sm:w-2/3 w-full">
                    <input type="email" id="email" name="email" 
                           class="w-full h-11 px-3.5 bg-[#f9fafb] border border-[#d9e2ec] rounded-lg outline-none transition-all text-sm text-[#172033] input-focus"
                           placeholder="admin@tsicoop.org">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-start space-y-1.5 sm:space-y-0">
                <div class="sm:w-1/3 sm:pt-2">
                    <label for="password" class="block text-[11px] font-extrabold text-[#607086] uppercase tracking-wider px-1">
                        Password
                    </label>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wide mt-0.5 px-1">Console Key</p>
                </div>
                <div class="sm:w-2/3 w-full">
                    <input type="password" id="password" name="password" 
                           class="w-full h-11 px-3.5 bg-[#f9fafb] border border-[#d9e2ec] rounded-lg outline-none transition-all text-sm text-[#172033] input-focus"
                           placeholder="••••••••••••">
                </div>
            </div>

            <div class="pt-4 w-full">
                <div class="flex justify-end mb-3">
                    <a href="password-reset.html" class="text-[10px] font-bold text-[#006a67] hover:underline uppercase tracking-wider">
                        Recover Access
                    </a>
                </div>
                <button type="submit"
                        class="w-full h-12 bg-[#006a67] text-white rounded-lg font-bold text-xs uppercase tracking-widest shadow-sm hover:bg-[#005a57] active:scale-[0.99] transition-all">
                    Sign In
                </button>
            </div>
        </div>
    </form>

</div>

<script>
/**
 * Simplified bypass login handler for direct static layout presentation.
 */
function handleLogin(event) {
    event.preventDefault();
    
    // Set mock details so dashboard elements don't read null properties
    localStorage.setItem('username', 'Demo Administrator');
    localStorage.setItem('role', 'ADMIN');
    
    // Immediate direct routing
    window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
