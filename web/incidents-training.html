<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Security Training — TSI Compass</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .filter-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
    .filter-bar select,.filter-bar input{padding:.45rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--card);color:var(--text)}
    .filter-bar input{flex:1;min-width:180px}
    .badge{display:inline-block;padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .badge-draft{background:#f3f4f6;color:#6b7280}
    .badge-active{background:#d1fae5;color:#065f46}
    .badge-completed{background:#dbeafe;color:#1e40af}
    .badge-cancelled{background:#fee2e2;color:#991b1b}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}
    .campaign-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
    .campaign-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
    .campaign-card-title{font-weight:600;font-size:.95rem;line-height:1.35}
    .campaign-card-meta{font-size:.8rem;color:var(--text-muted);margin-bottom:.75rem}
    .campaign-card-meta span{margin-right:1rem}
    .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0}
    .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
    .progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted)}
    .card-actions{display:flex;gap:.5rem;margin-top:.75rem}
    .btn{padding:.45rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--border);color:var(--text)}
    .btn-sm{padding:.3rem .65rem;font-size:.78rem}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border-radius:10px;padding:2rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
    .modal h3{margin:0 0 1.25rem;font-size:1.05rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--text-muted)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:6px;font-size:.875rem;background:var(--bg);color:var(--text);box-sizing:border-box}
    .form-group textarea{resize:vertical;min-height:80px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .modal-actions{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-size:.85rem;z-index:999;display:none}
    .toast.show{display:block}
    .empty-state{text-align:center;padding:3rem;color:var(--text-muted)}
  </style>
</head>
<body>
<div id="app-shell"></div>
<script>
var token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
</script>
<script src="js/shell.js"></script>

<div class="main-content" style="padding:1.5rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.25rem">
        <a href="incidents.html" style="color:var(--accent);text-decoration:none">Incidents &amp; Awareness</a> › Security Training
      </div>
      <h2 style="margin:0;font-size:1.3rem">Security Training Campaigns</h2>
    </div>
    <button class="btn btn-primary" onclick="openAdd()">+ New Campaign</button>
  </div>

  <div class="filter-bar">
    <select id="f-status" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="ACTIVE">Active</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
    <input id="f-search" type="text" placeholder="Search campaigns…" oninput="applyFilters()"/>
  </div>

  <div id="campaigns-grid" class="cards-grid">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>New Training Campaign</h3>
    <div class="form-group">
      <label>Campaign Name *</label>
      <input id="a-name" type="text" placeholder="e.g. Phishing Awareness Q3"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="a-desc" placeholder="Campaign goals and content overview…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input id="a-start" type="date"/>
      </div>
      <div class="form-group">
        <label>End Date</label>
        <input id="a-end" type="date"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Target Audience</label>
        <input id="a-audience" type="text" placeholder="e.g. All Staff, IT Team…"/>
      </div>
      <div class="form-group">
        <label>Target Completion (%)</label>
        <input id="a-target" type="number" min="1" max="100" placeholder="100"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAdd()">Create Campaign</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Update Campaign</h3>
    <input type="hidden" id="e-id"/>
    <div class="form-group">
      <label>Campaign Name</label>
      <input id="e-name" type="text"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="e-desc"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        <input id="e-start" type="date"/>
      </div>
      <div class="form-group">
        <label>End Date</label>
        <input id="e-end" type="date"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Target Audience</label>
        <input id="e-audience" type="text"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="e-status">
          <option value="DRAFT">Draft</option>
          <option value="ACTIVE">Active</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Target Completion (%)</label>
        <input id="e-target" type="number" min="1" max="100"/>
      </div>
      <div class="form-group">
        <label>Actual Completion (%)</label>
        <input id="e-actual" type="number" min="0" max="100"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var state = { campaigns: [] };

function api(func, params) {
  params = params || {};
  return fetch('/api/v1/incidents', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ _func: func }, params))
  }).then(function(r) { if (r.status === 401) location.href = 'index.html'; return r.json(); });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#dc2626' : '#1e293b';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

var STATUS_PILL = { DRAFT:'badge-draft', ACTIVE:'badge-active', COMPLETED:'badge-completed', CANCELLED:'badge-cancelled' };

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function renderCards(rows) {
  var grid = document.getElementById('campaigns-grid');
  if (!rows.length) {
    grid.innerHTML = '<div class="empty-state">No campaigns found</div>';
    return;
  }
  grid.innerHTML = rows.map(function(r) {
    var actual = r.completion_pct || 0;
    var target = r.target_pct || 100;
    var pctColor = actual >= target ? '#10b981' : actual >= target * 0.7 ? '#f59e0b' : '#ef4444';
    return '<div class="campaign-card">' +
      '<div class="campaign-card-header">' +
        '<div class="campaign-card-title">' + esc(r.name) + '</div>' +
        '<span class="badge ' + (STATUS_PILL[r.status]||'') + '">' + esc(r.status||'—') + '</span>' +
      '</div>' +
      '<div class="campaign-card-meta">' +
        '<span>&#128197; ' + fmtDate(r.start_date) + ' – ' + fmtDate(r.end_date) + '</span>' +
        '<span>&#128101; ' + esc(r.target_audience || 'All Staff') + '</span>' +
      '</div>' +
      (r.description ? '<div style="font-size:.82rem;color:var(--text-muted);margin-bottom:.75rem">' + esc(r.description) + '</div>' : '') +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + Math.min(actual,100) + '%;background:' + pctColor + '"></div></div>' +
      '<div class="progress-label"><span>Completion</span><span>' + actual + '% / ' + target + '%</span></div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-sm btn-secondary" onclick=\'openEdit(' + JSON.stringify(r) + ')\'>Edit</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

function applyFilters() {
  var status = document.getElementById('f-status').value;
  var search = document.getElementById('f-search').value.toLowerCase();
  var filtered = state.campaigns.filter(function(r) {
    if (status && r.status !== status) return false;
    if (search && !((r.name||'').toLowerCase().includes(search) ||
        (r.target_audience||'').toLowerCase().includes(search))) return false;
    return true;
  });
  renderCards(filtered);
}

function loadPage() {
  api('list_campaigns').then(function(res) {
    if (res.success) {
      state.campaigns = res.data || [];
      renderCards(state.campaigns);
    }
  });
}

function openAdd() {
  ['a-name','a-desc','a-audience'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('a-start').value = '';
  document.getElementById('a-end').value = '';
  document.getElementById('a-target').value = '100';
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

function submitAdd() {
  var name = document.getElementById('a-name').value.trim();
  var start = document.getElementById('a-start').value;
  if (!name || !start) { toast('Campaign name and start date are required', true); return; }
  api('add_campaign', {
    name: name,
    description: document.getElementById('a-desc').value.trim(),
    start_date: start,
    end_date: document.getElementById('a-end').value || null,
    target_audience: document.getElementById('a-audience').value.trim(),
    target_pct: parseInt(document.getElementById('a-target').value) || 100
  }).then(function(res) {
    if (res.success) { toast('Campaign created'); closeAdd(); loadPage(); }
    else toast(res.message || 'Error creating campaign', true);
  });
}

function openEdit(r) {
  document.getElementById('e-id').value = r.id;
  document.getElementById('e-name').value = r.name || '';
  document.getElementById('e-desc').value = r.description || '';
  document.getElementById('e-start').value = (r.start_date||'').substring(0,10);
  document.getElementById('e-end').value = (r.end_date||'').substring(0,10);
  document.getElementById('e-audience').value = r.target_audience || '';
  document.getElementById('e-status').value = r.status || 'DRAFT';
  document.getElementById('e-target').value = r.target_pct || 100;
  document.getElementById('e-actual').value = r.completion_pct || 0;
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

function submitEdit() {
  var id = document.getElementById('e-id').value;
  api('update_campaign', {
    id: id,
    name: document.getElementById('e-name').value.trim(),
    description: document.getElementById('e-desc').value.trim(),
    start_date: document.getElementById('e-start').value || null,
    end_date: document.getElementById('e-end').value || null,
    target_audience: document.getElementById('e-audience').value.trim(),
    status: document.getElementById('e-status').value,
    target_pct: parseInt(document.getElementById('e-target').value) || 100,
    completion_pct: parseInt(document.getElementById('e-actual').value) || 0
  }).then(function(res) {
    if (res.success) { toast('Campaign updated'); closeEdit(); loadPage(); }
    else toast(res.message || 'Error updating campaign', true);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeAdd(); closeEdit(); }
});

loadPage();
</script>
</body>
</html>
